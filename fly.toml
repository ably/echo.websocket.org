# fly.toml app configuration file generated for echo-websocket on 2023-11-29T18:07:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "echo-websocket"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"    # Use "suspend" for faster restarts (~300ms)
  auto_start_machines = true
  min_machines_running = 1          # Keep 1 always running in primary region
  processes = ["app"]
  
  [http_service.concurrency]
    type = "connections"            # Correct for WebSocket connections
    soft_limit = 7500                # Start deprioritizing at 50% of hard limit
    hard_limit = 15000               # Maximum connections per machine (3x previous for 4x CPU)

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 1024

[metrics]
  port = 9091
  path = "/metrics"
